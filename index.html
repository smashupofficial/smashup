<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SmashUp — Smash Burgers</title>

  <meta
    name="description"
    content="SmashUp Smash Burgers — Menu e contatti"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <style>

    /* =========================
       BASE
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0d0d0d;
      color: #f0ead8;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding-bottom: 3rem;
    }


    /* =========================
       HERO / LOGO
    ========================= */

    .hero {
      text-align: center;
      padding: 1.8rem 1.5rem 1.8rem;
      border-bottom: 1px solid #222;
    }

    .main-logo {
      width: min(92%, 430px);
      height: auto;
      display: block;
      margin: 0 auto;
      object-fit: contain;
    }

    .tagline {
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      color: #777;
      margin-top: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .divider {
      width: 50px;
      height: 1px;
      background: #e8a020;
      opacity: 0.55;
      margin: 1.2rem auto 0;
    }


    /* =========================
       LINKS
    ========================= */

    .links {
      max-width: 440px;
      margin: 1.6rem auto 0;
      padding: 0 1.2rem;

      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;

      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 10px;

      padding: 14px 18px;

      text-decoration: none;
      color: #f0ead8;

      transition:
        border-color 0.2s,
        background 0.2s,
        transform 0.2s;
    }

    .btn:hover {
      border-color: #e8a020;
      background: #1b1b1b;
      transform: translateY(-1px);
    }

    .btn-icon {
      width: 38px;
      height: 38px;

      border-radius: 8px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }

    .btn-icon.ig {
      background:
        linear-gradient(
          135deg,
          #f09433,
          #e6683c,
          #dc2743,
          #cc2366,
          #bc1888
        );
    }

    .btn-label {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      flex: 1;
    }

    .btn-arrow {
      color: #444;
      transition: color 0.2s;
    }

    .btn:hover .btn-arrow {
      color: #e8a020;
    }


    /* =========================
       MENU
    ========================= */

    .menu-wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 0 1.2rem;
    }

    .section-label {
      text-align: center;

      font-family: 'Oswald', sans-serif;
      font-size: 11px;

      letter-spacing: 5px;

      color: #555;

      padding: 2rem 0 1rem;
    }


    /* CATEGORIE */

    .category {
      font-family: 'Oswald', sans-serif;
      font-size: 12px;

      letter-spacing: 4px;

      color: #e8a020;

      margin: 1.8rem 0 0.5rem;

      padding-bottom: 7px;

      border-bottom: 1px solid #33280f;
    }


    /* PRODOTTO */

    .item {
      display: flex;

      justify-content: space-between;
      align-items: baseline;

      padding: 12px 0;

      border-bottom: 1px solid #1a1a1a;
    }

    .item-name {
      font-family: 'Oswald', sans-serif;

      font-size: 17px;

      letter-spacing: 1px;

      color: #f0ead8;
    }

    .item-desc {
      font-size: 11px;

      color: #555;

      margin-top: 4px;

      letter-spacing: 0.3px;

      max-width: 260px;

      line-height: 1.5;
    }

    .item-price {
      font-family: 'Oswald', sans-serif;

      font-size: 17px;

      color: #e8a020;

      letter-spacing: 1px;

      flex-shrink: 0;

      margin-left: 12px;
    }


    /* EXTRA */

    .extra-row {
      display: flex;

      justify-content: space-between;

      font-family: 'Oswald', sans-serif;

      font-size: 13px;

      color: #888;

      padding: 10px 0;

      border-bottom: 1px solid #171717;

      letter-spacing: 1px;
    }

    .extra-price {
      color: #e8a020;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;

      margin-top: 3rem;

      font-family: 'Oswald', sans-serif;

      font-size: 11px;

      letter-spacing: 3px;

      color: #333;
    }

    footer span {
      color: #e8a020;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      .hero {
        padding-top: 1.3rem;
      }

      .main-logo {
        width: 94%;
      }

      .menu-wrap,
      .links {
        padding-left: 1rem;
        padding-right: 1rem;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       LOGO
  ========================== -->

  <header class="hero">

    <img
      src="smashup-logo.jpeg"
      alt="SmashUp Smash Burgers"
      class="main-logo"
    />

    <p class="tagline">
      One burger. Done right.
    </p>

    <div class="divider"></div>

  </header>



  <!-- =========================

  <div class="links">

        <svg

          <rect

          <circle
            cx="12"

          />

          <circle
            cx="17.5"
            cy="6.5"

            fill="white"

          />

        </svg>

      </div>


      <span class="btn-label">
        SEGUICI SU INSTAGRAM
      </span>


      <svg
        class="btn-arrow"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >

        <path d="M5 12h14M12 5l7 7-7 7"/>

      </svg>

    </a>

  </div>



  <!-- =========================

  ========================== -->

  <main class="menu-wrap">

    <p class="section-label">
      — IL NOSTRO MENU —
    </p>



    <!-- =====================

    <div class="category">

    </div>


    <div class="item">

      <div>
        <div class="item-name">
          S
        </div>
      </div>

      <div class="item-price">
        €6.00
      </div>

    </div>


    <div class="item">

      <div>
        <div class="item-name">
          M
        </div>
      </div>

      <div class="item-price">
        €8.00
      </div>

    </div>


    <div class="item">

      <div>
        <div class="item-name">
          L
        </div>
      </div>

      <div class="item-price">
        €10.00
      </div>

    </div>


    <div class="extra-row">

      <span>
        CRISPY BACON
      </span>

      <span class="extra-price">
        +€1.50
      </span>

    </div>



    <!-- =====================

    ====================== -->

    <div class="category">

    </div>


    <div class="item">

      <div>
        <div class="item-name">
          REGULAR
        </div>
      </div>

    </div>


    <div class="item">

      <div>

          SWEET POTATO
        </div>
      </div>

      <div class="item-price">

      </div>

    </div>


    <div class="item">

      <div>
        <div class="item-name">
          BACON & CHEESE
        </div>
      </div>

      <div class="item-price">
        €4.50
      </div>

    </div>



    <!-- =====================

    ====================== -->

    <div class="category">
      CHICKEN
    </div>


    <div class="item">

      <div>
        <div class="item-name">
          CHICKEN TENDERS
        </div>
      </div>

      <div class="item-price">

    </div>



    <!-- =====================
         DRINKS
    ====================== -->

    <div class="category">
      DRINKS
    </div>


    <div class="item">

      <div>
        <div class="item-name">
          SOFT DRINKS
        </div>
      </div>

      <div class="item-price">
        €2.50
      </div>

    </div>


    <div class="item">

      <div>
        <div class="item-name">
          BEER
        </div>
      </div>

      <div class="item-price">
        €3.50
      </div>

    </div>


  </main>



  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    <span>⚡</span>

    SMASHUP · SMASH BURGERS

  </footer>


</body>
</html>
