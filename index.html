<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SmashUp — Smash Burgers</title>

  <meta
    name="description"
    content="SmashUp Smash Burgers — Menu and contacts"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0d0d0d;
      color: #f0ead8;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding-bottom: 3rem;
    }

    /* =========================
       HERO / LOGO
    ========================= */

    .hero {
      text-align: center;
      padding: 0.5rem 1.2rem 1.2rem;
      border-bottom: 1px solid #222;
      overflow: hidden;
    }

    .main-logo {
      display: block;
      width: min(92%, 390px);
      height: auto;
      margin: -45px auto -55px;
      object-fit: contain;
    }

    .tagline {
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      color: #777;
      margin-top: 0;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .divider {
      width: 50px;
      height: 1px;
      background: #e8a020;
      opacity: 0.55;
      margin: 1rem auto 0;
    }

    /* =========================
       LANGUAGE SWITCH
    ========================= */

    .language-switch {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 1.2rem auto 0;
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .lang-btn {
      background: transparent;
      border: none;
      color: #555;
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .lang-btn:hover {
      color: #e8a020;
    }

    .lang-btn.active {
      color: #e8a020;
    }

    .lang-separator {
      color: #333;
    }

    /* =========================
       LINKS
    ========================= */

    .links {
      max-width: 440px;
      margin: 1.2rem auto 0;
      padding: 0 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 14px 18px;
      text-decoration: none;
      color: #f0ead8;
      transition:
        border-color 0.2s,
        background 0.2s,
        transform 0.2s;
    }

    .btn:hover {
      border-color: #e8a020;
      background: #1b1b1b;
      transform: translateY(-1px);
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-icon.ig {
      background: linear-gradient(
        135deg,
        #f09433,
        #e6683c,
        #dc2743,
        #cc2366,
        #bc1888
      );
    }

    .btn-label {
      font-family: 'Oswald', sans-serif;
      font-size: 16px;
      letter-spacing: 2px;
      flex: 1;
    }

    .btn-arrow {
      color: #444;
      transition: color 0.2s;
    }

    .btn:hover .btn-arrow {
      color: #e8a020;
    }

    /* =========================
       MENU
    ========================= */

    .menu-wrap {
      max-width: 440px;
      margin: 0 auto;
      padding: 0 1.2rem;
    }

    .section-label {
      text-align: center;
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 5px;
      color: #555;
      padding: 2rem 0 1rem;
    }

    .category {
      font-family: 'Oswald', sans-serif;
      font-size: 12px;
      letter-spacing: 4px;
      color: #e8a020;
      margin: 1.8rem 0 0.5rem;
      padding-bottom: 7px;
      border-bottom: 1px solid #33280f;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid #1a1a1a;
    }

    .item-name {
      font-family: 'Oswald', sans-serif;
      font-size: 17px;
      letter-spacing: 1px;
      color: #f0ead8;
    }

    .item-price {
      font-family: 'Oswald', sans-serif;
      font-size: 17px;
      color: #e8a020;
      letter-spacing: 1px;
      flex-shrink: 0;
      margin-left: 12px;
    }

    .extra-row {
      display: flex;
      justify-content: space-between;
      font-family: 'Oswald', sans-serif;
      font-size: 13px;
      color: #888;
      padding: 10px 0;
      border-bottom: 1px solid #171717;
      letter-spacing: 1px;
    }

    .extra-price {
      color: #e8a020;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;
      margin-top: 3rem;
      font-family: 'Oswald', sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      color: #333;
    }

    footer span {
      color: #e8a020;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {
      .hero {
        padding-top: 0.3rem;
      }

      .main-logo {
        width: 92%;
        max-width: 370px;
        margin: -40px auto -55px;
      }

      .menu-wrap,
      .links {
        padding-left: 1rem;
        padding-right: 1rem;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HERO
  ========================== -->

  <header class="hero">

    <img
      src="smashup-logo.png"
      alt="SmashUp Smash Burgers"
      class="main-logo"
    />

    <p class="tagline">
      ONE BURGER. DONE RIGHT.
    </p>

    <div class="divider"></div>

  </header>

  <!-- =========================
       LANGUAGE
  ========================== -->

  <div class="language-switch">

    <button
      class="lang-btn active"
      id="lang-en"
      type="button"
      onclick="setLanguage('en')"
    >
      EN
    </button>

    <span class="lang-separator">|</span>

    <button
      class="lang-btn"
      id="lang-it"
      type="button"
      onclick="setLanguage('it')"
    >
      IT
    </button>

  </div>

  <!-- =========================
       INSTAGRAM
  ========================== -->

  <div class="links">

    <a
      class="btn"
      href="https://www.instagram.com/smashupmartina"
      target="_blank"
      rel="noopener"
    >

      <div class="btn-icon ig">

        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="white"
          stroke-width="2"
        >
          <rect
            x="2"
            y="2"
            width="20"
            height="20"
            rx="5"
            ry="5"
          />

          <circle
            cx="12"
            cy="12"
            r="4"
          />

          <circle
            cx="17.5"
            cy="6.5"
            r="1.2"
            fill="white"
            stroke="none"
          />
        </svg>

      </div>

      <span
        class="btn-label"
        data-en="FOLLOW US ON INSTAGRAM"
        data-it="SEGUICI SU INSTAGRAM"
      >
        FOLLOW US ON INSTAGRAM
      </span>

      <svg
        class="btn-arrow"
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>

    </a>

  </div>

  <!-- =========================
       MENU
  ========================== -->

  <main class="menu-wrap">

    <p
      class="section-label"
      data-en="— OUR MENU —"
      data-it="— IL NOSTRO MENU —"
    >
      — OUR MENU —
    </p>

    <!-- THE SMASH -->

    <div class="category">
      THE SMASH
    </div>

    <div class="item">
      <div class="item-name">S</div>
      <div class="item-price">€6.00</div>
    </div>

    <div class="item">
      <div class="item-name">M</div>
      <div class="item-price">€8.00</div>
    </div>

    <div class="item">
      <div class="item-name">L</div>
      <div class="item-price">€10.00</div>
    </div>

    <div class="extra-row">

      <span
        data-en="CRISPY BACON"
        data-it="BACON CROCCANTE"
      >
        CRISPY BACON
      </span>

      <span class="extra-price">
        +€1.50
      </span>

    </div>

    <!-- FRIES -->

    <div
      class="category"
      data-en="FRIES"
      data-it="PATATINE"
    >
      FRIES
    </div>

    <div class="item">

      <div
        class="item-name"
        data-en="REGULAR"
        data-it="CLASSICHE"
      >
        REGULAR
      </div>

      <div class="item-price">
        €3.00
      </div>

    </div>

    <div class="item">

      <div
        class="item-name"
        data-en="SWEET POTATO"
        data-it="PATATE DOLCI"
      >
        SWEET POTATO
      </div>

      <div class="item-price">
        €4.00
      </div>

    </div>

    <div class="item">

      <div
        class="item-name"
        data-en="BACON &amp; CHEESE"
        data-it="BACON &amp; FORMAGGIO"
      >
        BACON &amp; CHEESE
      </div>

      <div class="item-price">
        €4.50
      </div>

    </div>

    <!-- CHICKEN -->

    <div
      class="category"
      data-en="CHICKEN"
      data-it="POLLO"
    >
      CHICKEN
    </div>

    <div class="item">

      <div
        class="item-name"
        data-en="CHICKEN TENDERS"
        data-it="FILETTI DI POLLO"
      >
        CHICKEN TENDERS
      </div>

      <div class="item-price">
        €4.90
      </div>

    </div>

    <!-- DRINKS -->

    <div
      class="category"
      data-en="DRINKS"
      data-it="BEVANDE"
    >
      DRINKS
    </div>

    <div class="item">

      <div
        class="item-name"
        data-en="SOFT DRINKS"
        data-it="BIBITE"
      >
        SOFT DRINKS
      </div>

      <div class="item-price">
        €2.50
      </div>

    </div>

    <div class="item">

      <div
        class="item-name"
        data-en="BEER"
        data-it="BIRRA"
      >
        BEER
      </div>

      <div class="item-price">
        €3.50
      </div>

    </div>

  </main>

  <!-- =========================
       FOOTER
  ========================== -->

  <footer>
    <span>⚡</span>
    SMASHUP · SMASH BURGERS
  </footer>

  <!-- =========================
       LANGUAGE SCRIPT
  ========================== -->

  <script>
    function setLanguage(language) {

      const elements = document.querySelectorAll('[data-en][data-it]');

      elements.forEach(function(element) {
        element.innerHTML = element.getAttribute('data-' + language);
      });

      const englishButton = document.getElementById('lang-en');
      const italianButton = document.getElementById('lang-it');

      if (language === 'en') {
        englishButton.classList.add('active');
        italianButton.classList.remove('active');

        document.documentElement.lang = 'en';
      } else {
        italianButton.classList.add('active');
        englishButton.classList.remove('active');

        document.documentElement.lang = 'it';
      }
    }

    setLanguage('en');
  </script>

</body>
</html>
